<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Blog - Simple Blog Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="form">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navdiv">
            <div id="logo">📖Tech Blogs</div>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="add_blog.html">Add Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <form>
                    <input type="search" placeholder="Search blogs">
                    <button>🔍</button>
                </form>
            </ul>
        </div>
    </nav>

    <h2>Edit Blog Post</h2>

    <div class="form-container">
        <form id="edit-content">
            <div class="form-group">
                <label class="reqd">Blog Title<span style="color: red;">*</span></label>
                <input type="text" id="title" required placeholder="Enter blog title">
            </div>

            <div class="form-group">
                <label>Category<span style="color: red;">*</span></label>
                <select id="category" name="category">
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Node.js">Node.js</option>
                </select>
            </div>

            <div class="form-group">
                <label class="reqd">Author Name<span style="color: red;">*</span></label>
                <input type="text" id="author" required placeholder="Enter author name">
            </div>

            <div class="form-group">
                <label>Blog Image URL</label>
                <input type="url" id="image-url" placeholder="Enter image url">
            </div>

            <div class="form-group">
                <label class="reqd">Short Description<span style="color: red;">*</span></label>
                <textarea id="shortDesc" required placeholder="Add a short description"></textarea>
            </div>

            <div class="form-group">
                <label class="reqd">Blog Content<span style="color: red;">*</span></label>
                <textarea id="txt" required placeholder="Write your blog content here"></textarea>
            </div>

            <div class="form-group">
                <label>Tags</label>
                <input type="text" id="tags" name="tags" placeholder="#HTML #CSS #JavaScript">
            </div>

            <div class="buttons">
                <button type="submit">Update Blog</button>
                <a href="home.html" style="text-decoration: none;">
                    <button type="button" style="background: #6c757d;">Cancel</button>
                </a>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <div id="about">&copy; 2026 Tech Blog | Created by <b>Arpita Ghosh</b></div>
        <div id="social_icons">
            <a href="https://facebook.com" target="_blank"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://twitter.com" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://github.com" target="_blank"><i class="fa-brands fa-github"></i></a>
        </div>
    </footer>

    <!-- JavaScript Connected -->
    <script src="JS/edit_script.js"></script>
</body>
</html>
